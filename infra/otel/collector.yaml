# OpenTelemetry Collector bridge (research R16, ADR-0004; feature 002 research R8, R17).
# The services write JSON logs to stdout and serve Prometheus /metrics; this
# Collector converts both to OTLP and sends them to OpenObserve.

extensions:
  basicauth/openobserve:
    client_auth:
      username: ${env:OPENOBSERVE_USER}
      password: ${env:OPENOBSERVE_PASSWORD}

receivers:
  file_log/docker:
    include: [/var/lib/docker/containers/*/*-json.log]
    start_at: end
    operators:
      # Unwrap Docker's json-file envelope ({"log","stream","time"}).
      - type: container
        format: docker
        add_metadata_from_filepath: false
      # Docker's files carry no container names, so keep only mock_pms lines by their
      # own service.name field; postgres/redis/collector output is dropped.
      - type: filter
        expr: 'not (body matches "\"service\\.name\":\"mock_pms")'
      - type: json_parser
        parse_from: body
        parse_to: attributes
        severity:
          parse_from: attributes.severity_text
        timestamp:
          parse_from: attributes.timestamp
          layout_type: gotime
          layout: "2006-01-02T15:04:05.000Z07:00"
      - type: move
        from: attributes.body
        to: body
      - type: move
        from: attributes["service.name"]
        to: resource["service.name"]
      - type: move
        from: attributes["service.version"]
        to: resource["service.version"]
      - type: move
        from: attributes["deployment.environment"]
        to: resource["deployment.environment"]
      - type: move
        from: attributes["service.instance.id"]
        to: resource["service.instance.id"]
      - type: move
        from: attributes["deployment.id"]
        to: resource["deployment.id"]
      - type: remove
        field: attributes.timestamp

  prometheus:
    config:
      scrape_configs:
        # One target is enough: any instance returns cluster-wide totals from Redis.
        # job_name becomes service.name, matching the web service's logs.
        - job_name: mock_pms-web
          scrape_interval: 15s
          static_configs:
            - targets: ["mock_pms:4001"]
        # The Collector's own metrics, including its drop counters (Constitution VI).
        - job_name: otel-collector
          scrape_interval: 15s
          static_configs:
            - targets: ["localhost:8888"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
  # Second line of defense: services already redact before writing (Constitution VII).
  attributes/redact:
    actions:
      - action: delete
        pattern: "(?i)(token|secret|password|authorization)"
      - action: delete
        pattern: "^(name|first_name|last_name|email|phone|amount_cents)$"
  # /metrics emits target_info{service_version,deployment_environment}; promote those
  # labels to semantic-convention resource attributes. Cluster totals carry no instance id.
  transform/metrics_resource:
    metric_statements:
      - context: resource
        statements:
          - set(attributes["service.version"], attributes["service_version"]) where attributes["service_version"] != nil
          - set(attributes["deployment.environment"], attributes["deployment_environment"]) where attributes["deployment_environment"] != nil
          - delete_key(attributes, "service_version")
          - set(attributes["deployment.id"], attributes["deployment_id"]) where attributes["deployment_id"] != nil
          - delete_key(attributes, "deployment_environment")
          - delete_key(attributes, "deployment_id")
          - delete_key(attributes, "service_name")
          - delete_key(attributes, "service.instance.id") where attributes["service.name"] == "mock_pms-web"

  # Every record leaves with both deployment attributes (constitution VI), including the
  # Collector's own metrics, which carry neither. insert never overwrites a service's own value.
  resource/deployment:
    attributes:
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENVIRONMENT}
        action: insert
      - key: deployment.id
        value: ${env:DEPLOYMENT_ID}
        action: insert

exporters:
  # Loss bound (research R16): the sending queue is in memory and not persisted, so a
  # Collector restart loses whatever is queued — at most queue_size batches during an
  # OpenObserve outage. Service logs stay in Docker's files; metric totals stay in Redis.
  otlp_http/openobserve:
    # Configuration only (constitution VI): local .env and deployed hosts set this.
    endpoint: ${env:OPENOBSERVE_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/openobserve
    sending_queue:
      enabled: true
      queue_size: 1000
    retry_on_failure:
      enabled: true

service:
  extensions: [basicauth/openobserve]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs:
      receivers: [file_log/docker]
      processors: [memory_limiter, resource/deployment, attributes/redact, batch]
      exporters: [otlp_http/openobserve]
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, transform/metrics_resource, resource/deployment, batch]
      exporters: [otlp_http/openobserve]

# Environment host stack (feature 002 research R7). Installed as /opt/rentsync/compose.yaml.
# Run only through rentsync-deploy, which passes --env-file /run/rentsync/env (rendered from SSM
# by rentsync-render-env) and sets MOCK_PMS_IMAGE. Each container receives only the variables it
# needs. Service names match the local compose.yaml, so the Collector's scrape target
# (mock_pms:4001) and the feature 001 tools work unchanged. Never add build: here.

x-mock-pms: &mock-pms
  image: ${MOCK_PMS_IMAGE:-rentsync/not-deployed:none}
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  environment: &mock-pms-env
    DATABASE_URL: ${DATABASE_URL}
    REDIS_URL: ${REDIS_URL}
    ADMIN_TOKEN: ${ADMIN_TOKEN}
    DEPLOYMENT_ID: ${DEPLOYMENT_ID}
    DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT}
    SERVICE_NAME: mock_pms-web

services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOSTNAME: ${SITE_HOSTNAME}
      ACME_EMAIL: ${ACME_EMAIL}
      ACME_CA: ${ACME_CA}
    volumes:
      - /opt/rentsync/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/data/caddy:/data # certificates survive host replacement (research R6)

  mock_pms:
    <<: *mock-pms
    volumes:
      - /srv/data/receiver:/receiver_logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:4001/healthz/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  mock_pms_worker:
    <<: *mock-pms
    command: ["bundle", "exec", "bin/delivery_worker"]
    environment:
      <<: *mock-pms-env
      SERVICE_NAME: mock_pms-worker
    # An in-flight delivery may finish; anything cut off is retried from the outbox (FR-030).
    stop_grace_period: 30s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /srv/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/collector.yaml"]
    user: "0:0" # read access to Docker's container log files
    environment:
      OPENOBSERVE_OTLP_ENDPOINT: ${OPENOBSERVE_OTLP_ENDPOINT}
      OPENOBSERVE_USER: ${OPENOBSERVE_USER}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT}
    volumes:
      - /opt/rentsync/collector.yaml:/etc/otelcol/collector.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

  # --- tools profile: feature 001 quickstart §5-§7 on a deployed host (002 quickstart §4) ---
  receiver:
    <<: *mock-pms
    profiles: ["tools"]
    restart: "no"
    command: ["bundle", "exec", "bin/test_receiver", "--port", "9999"]
    environment:
      <<: *mock-pms-env
      SERVICE_NAME: mock_pms-tool
      RECEIVER_SECRET: ${RECEIVER_SECRET:-}
      RECEIVER_FAIL_FIRST: ${RECEIVER_FAIL_FIRST:-0}
    volumes:
      - /srv/data/receiver:/receiver_logs

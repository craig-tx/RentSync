# Environment host stack (feature 002 research R7). Installed as /opt/rentsync/compose.yaml.
# Run only through rentsync-deploy, which passes --env-file /run/rentsync/env (rendered from SSM
# by rentsync-render-env) and sets MOCK_PMS_IMAGE. Each container receives only the variables it
# needs. Service names match the local compose.yaml, so the Collector's scrape target
# (mock_pms:4001) and the feature 001 tools work unchanged. Never add build: here.

x-mock-pms: &mock-pms
  image: ${MOCK_PMS_IMAGE:-rentsync/not-deployed:none}
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  environment: &mock-pms-env
    DATABASE_URL: ${DATABASE_URL}
    REDIS_URL: ${REDIS_URL}
    ADMIN_TOKEN: ${ADMIN_TOKEN}
    DEPLOYMENT_ID: ${DEPLOYMENT_ID}
    DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT}
    SERVICE_NAME: mock_pms-web

# RentSync's API and worker (feature 003 contracts/host-changes.md), from ${API_IMAGE}, set by
# rentsync-deploy. Behind the "api" profile: rentsync-deploy enables it only for a release that
# carries an API image, so a reload or rollback to an earlier release runs the mock alone.
# Settings.validate! needs the same keys in both processes; only the web process registers with
# the mock and serves /admin, so only it gets the mock's admin token.
x-api: &api
  image: ${API_IMAGE:-rentsync/not-deployed:none}
  profiles: ["api"]
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  environment: &api-env
    RENTSYNC_DATABASE_URL: ${RENTSYNC_DATABASE_URL}
    RENTSYNC_REDIS_URL: ${RENTSYNC_REDIS_URL}
    RENTSYNC_ENCRYPTION_KEYS: ${RENTSYNC_ENCRYPTION_KEYS}
    RENTSYNC_OPERATOR_SEED_PASSWORD: ${RENTSYNC_OPERATOR_SEED_PASSWORD}
    RENTSYNC_SESSION_SECRET: ${RENTSYNC_SESSION_SECRET}
    PMS_PUBLIC_URL: ${PMS_PUBLIC_URL}
    PMS_API_URL: ${PMS_API_URL}
    APP_PUBLIC_URL: ${APP_PUBLIC_URL}
    WEBHOOK_SUBSCRIBER_URL: ${WEBHOOK_SUBSCRIBER_URL}
    DEPLOYMENT_ID: ${DEPLOYMENT_ID}
    DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT}
    MALLOC_ARENA_MAX: "2" # research R14; the image sets it too
    SERVICE_NAME: rentsync-api-worker

services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOSTNAME: ${SITE_HOSTNAME}
      APP_HOSTNAME: ${APP_HOSTNAME}
      ACME_EMAIL: ${ACME_EMAIL}
      ACME_CA: ${ACME_CA}
    volumes:
      - /opt/rentsync/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/data/caddy:/data # certificates survive host replacement (research R6)

  mock_pms:
    <<: *mock-pms
    volumes:
      - /srv/data/receiver:/receiver_logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:4001/healthz/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  mock_pms_worker:
    <<: *mock-pms
    command: ["bundle", "exec", "bin/delivery_worker"]
    environment:
      <<: *mock-pms-env
      SERVICE_NAME: mock_pms-worker
    # An in-flight delivery may finish; anything cut off is retried from the outbox (FR-030).
    stop_grace_period: 30s

  api:
    <<: *api
    environment:
      <<: *api-env
      MOCK_PMS_ADMIN_TOKEN: ${MOCK_PMS_ADMIN_TOKEN}
      SERVICE_NAME: rentsync-api-web
    mem_limit: 256m # research R14
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:4002/healthz/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  api_worker:
    <<: *api
    command: ["bundle", "exec", "bin/worker"]
    mem_limit: 192m # research R14
    # A claimed job finishes or is released; a lease covers anything cut off (ADR 0009).
    stop_grace_period: 30s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /srv/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/collector.yaml"]
    user: "0:0" # read access to Docker's container log files
    environment:
      OPENOBSERVE_OTLP_ENDPOINT: ${OPENOBSERVE_OTLP_ENDPOINT}
      OPENOBSERVE_USER: ${OPENOBSERVE_USER}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT}
      # Go's soft memory limit, ~80% of memory_limiter's limit_mib (256) in collector.yaml, as
      # the Collector docs advise: the runtime collects garbage harder near it, before the
      # limiter starts refusing data (research R4: small hosts have little headroom).
      GOMEMLIMIT: 204MiB
      # A quarter of the local 15s: each scrape stores one row per series in OpenObserve.
      METRICS_SCRAPE_INTERVAL: 60s
    volumes:
      - /opt/rentsync/collector.yaml:/etc/otelcol/collector.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

  # --- tools profile: feature 001 quickstart §5-§7 on a deployed host (002 quickstart §4) ---
  receiver:
    <<: *mock-pms
    profiles: ["tools"]
    restart: "no"
    command: ["bundle", "exec", "bin/test_receiver", "--port", "9999"]
    environment:
      <<: *mock-pms-env
      SERVICE_NAME: mock_pms-tool
      RECEIVER_SECRET: ${RECEIVER_SECRET:-}
      RECEIVER_FAIL_FIRST: ${RECEIVER_FAIL_FIRST:-0}
    volumes:
      - /srv/data/receiver:/receiver_logs

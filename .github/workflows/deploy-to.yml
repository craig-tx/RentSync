# Deploys one image to one deployment through SSM Run Command, then checks it from the
# internet (feature 002 research R9; contracts/host-interface.md). Reusable: called by
# release.yml and deploy.yml. The job runs in the GitHub Environment named by the
# DeploymentId, so prod-us waits for its required reviewer. The URL comes from that
# Environment's SITE_URL variable, and the AWS role from its AWS_ROLE_ARN variable: the prod-us
# Environment overrides the repository's role with rentsync-github-actions-prod, the only role
# IAM lets run commands on production (protected) hosts.
name: Deploy to

on:
  workflow_call:
    inputs:
      deployment_id:
        description: DeploymentId, which is also the GitHub Environment name (dev-staging, prod-us)
        required: true
        type: string
      image_tag:
        description: Full commit SHA to deploy; ignored for rollback and reload
        required: false
        type: string
        default: ""
      image_digest:
        description: sha256 digest from build-image.yml; required with image_tag, so the host pulls exactly that image
        required: false
        type: string
        default: ""
      rollback:
        description: Deploy the previous image instead
        required: false
        type: boolean
        default: false
      reload:
        description: Re-render secrets and restart the current image (secret rotation)
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment_id }}
    concurrency:
      group: deploy-${{ inputs.deployment_id }}
      cancel-in-progress: false
    env:
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      ROLLBACK: ${{ inputs.rollback }}
      RELOAD: ${{ inputs.reload }}
      SITE_URL: ${{ vars.SITE_URL }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Check inputs
        run: |
          [[ "$DEPLOYMENT_ID" =~ ^[a-z][a-z0-9-]{1,14}[a-z0-9]$ ]] || { echo "invalid deployment_id"; exit 1; }
          [ -n "$SITE_URL" ] || { echo "Environment $DEPLOYMENT_ID has no SITE_URL variable (runbook §Bootstrap)"; exit 1; }
          if [ "$ROLLBACK" = "true" ] && [ "$RELOAD" = "true" ]; then echo "choose rollback or reload, not both"; exit 1; fi
          if [ "$ROLLBACK" != "true" ] && [ "$RELOAD" != "true" ]; then
            [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "image_tag must be a full 40-character commit SHA"; exit 1; }
            [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "image_digest must come from build-image.yml (sha256:...)"; exit 1; }
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Waits for a host that is being replaced: a merge that changes host files starts the
      # replacement and this release together (infra/release/run-deploy.sh).
      - name: Run rentsync-deploy on the host
        run: |
          arg="$IMAGE_TAG@$IMAGE_DIGEST" # pinned: the host pulls exactly the image the build produced
          [ "$ROLLBACK" = "true" ] && arg="--rollback"
          [ "$RELOAD" = "true" ] && arg="--reload"
          bash infra/release/run-deploy.sh "$DEPLOYMENT_ID" "$arg"
      - name: Check /healthz from the internet
        run: |
          body="$(curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$SITE_URL/healthz")"
          echo "$body"
          [ "$(jq -r .status <<< "$body")" = ok ] || { echo "status is not ok"; exit 1; }
          [ "$(jq -r .deployment_id <<< "$body")" = "$DEPLOYMENT_ID" ] || { echo "wrong deployment answered"; exit 1; }
          if [ "$ROLLBACK" != "true" ] && [ "$RELOAD" != "true" ]; then
            [ "$(jq -r .version <<< "$body")" = "$IMAGE_TAG" ] || { echo "version is not $IMAGE_TAG"; exit 1; }
          fi

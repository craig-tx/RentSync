name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    # Service containers are reached on localhost inside an Actions job,
    # so these override the Compose hostnames in .env.example.
    env:
      RACK_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mock_pms_ci_gh
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mock_pms_ci_gh_test
      DEPLOYMENT_ID: ci-gh
      REDIS_URL: redis://localhost:6379/0
      ADMIN_TOKEN: ci-admin-token
    defaults:
      run:
        working-directory: mock_pms
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mock_pms
      - run: bundle exec bin/setup --test-db-only
      - run: bundle exec rubocop
      - run: bundle exec rspec
      - name: Gem vulnerability audit (ruby-advisory-db)
        run: |
          gem install bundler-audit -v 0.9.2 --no-document
          bundle-audit check --update

  # Feature 003: RentSync's API and worker, tested like the mock PMS.
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    # Service containers are reached on localhost; the other settings take spec_helper's
    # test values.
    env:
      RACK_ENV: test
      RENTSYNC_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rentsync_ci_gh_test
      RENTSYNC_REDIS_URL: redis://localhost:6379/1
      DEPLOYMENT_ID: ci-gh
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: api
      - run: bundle exec bin/setup --test-db-only
      - run: bundle exec rubocop
      - run: bundle exec rspec
      - name: Gem vulnerability audit (ruby-advisory-db)
        run: |
          gem install bundler-audit -v 0.9.2 --no-document
          bundle-audit check --update

  # Constitution VI: an OTLP backend runs in CI and receives every service's telemetry.
  telemetry-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp .env.example .env
      - name: Start the stack
        run: docker compose up -d --build --wait postgres redis mock_pms mock_pms_worker otel-collector openobserve
      - run: docker compose exec -T mock_pms bundle exec bin/setup
      - name: Generate a scenario
        run: |
          set -a; . ./.env; set +a
          curl -fsS -X POST localhost:4001/admin/scenarios/tenant_move_out \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" -d '{}'
      - name: Telemetry reaches OpenObserve
        run: docker compose exec -T mock_pms bundle exec bin/telemetry_smoke
      - name: Logs on failure
        if: failure()
        run: docker compose logs

  # Feature 003 research R17: the whole ingestion path under chaos. A real connect through the
  # mock's OAuth, a month-end burst delivered with every fault turned on, then one
  # reconciliation; every true PMS fact must be recorded exactly once (SC-003, SC-005).
  ingestion-e2e:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp .env.example .env
      - name: Start the stack
        run: docker compose up -d --build --wait postgres redis mock_pms mock_pms_worker api api_worker
      - run: docker compose exec -T mock_pms bundle exec bin/setup
      - run: docker compose exec -T api bundle exec bin/setup
      # bin/connect_operator plays the browser, so it runs on the runner, where the public
      # localhost URLs resolve. Standard library only: no bundle install.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.3"
      - name: Connect the first operator
        working-directory: api
        run: ruby bin/connect_operator --operator 1
      # The connect starts a full backfill. Finish it first, so the burst below reaches RentSync
      # by webhook rather than racing the backfill (which would record it all by reconciliation).
      - name: Backfill matches the PMS
        run: docker compose exec -T api bundle exec bin/compare_with_pms --wait 120 --reconcile
      - name: Month-end burst under chaos (quickstart §3)
        run: |
          set -a; . ./.env; set +a
          curl -fsS -X PUT localhost:4001/admin/chaos -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"duplicate_rate":0.3,"out_of_order_rate":0.3,"delay_rate":0.2,"delay_min_s":1,"delay_max_s":5,"malformed_rate":0.1,"server_error_rate":0.1,"seed":7}'
          curl -fsS -X POST localhost:4001/admin/scenarios/month_end_burst -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H 'Content-Type: application/json' -d '{}'
      - name: Every PMS fact recorded exactly once
        run: |
          docker compose exec -T api bundle exec bin/compare_with_pms --wait 180 --reconcile | tee compare.out
          grep -q '"webhook" =>' compare.out || { echo "no fact arrived by webhook"; exit 1; }
      - name: Logs on failure
        if: failure()
        run: docker compose logs

  # Feature 002: Terraform and host scripts (research R15). No cloud access needed.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate and test each root and the host module
        run: |
          for root in infra/terraform/shared infra/terraform/environment infra/terraform/modules/host infra/terraform/modules/network; do
            terraform -chdir=$root init -backend=false -input=false
            terraform -chdir=$root validate
            terraform -chdir=$root test
          done
      - name: Static checks
        run: bash infra/terraform/check_prevent_destroy.sh
      - name: Terraform security scan (Trivy; accepted findings in infra/terraform/.trivyignore)
        run: |
          docker run --rm -v "$PWD":/src aquasec/trivy:0.57.1 config --exit-code 1 \
            --severity HIGH,CRITICAL --ignorefile /src/infra/terraform/.trivyignore /src/infra/terraform
      - name: Shellcheck
        run: |
          find infra/host/bin infra/host/test infra/terraform infra/bootstrap infra/bootstrap/test infra/release infra/release/test infra/test -maxdepth 1 -type f \( -path "infra/host/bin/*" -o -name "*.sh" \) -print0 | xargs -0 shellcheck
      - name: Boot volume test (loop device)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xfsprogs
          sudo bash infra/host/test/boot_volume_test.sh
      - name: Swap file test (root)
        run: sudo bash infra/host/test/swap_test.sh
      - name: Bootstrap scripts refuse bash older than 4.4 (macOS ships 3.2)
        run: |
          for v in 3.2 4.3; do
            for s in bootstrap-init.sh bootstrap-iam.sh bootstrap-operator.sh bootstrap-github.sh; do
              if out="$(docker run --rm -v "$PWD":/src -w /src bash:$v bash infra/bootstrap/$s 2>&1)"; then
                echo "$s ran under bash $v"; exit 1
              fi
              grep -q 'need bash 4.4 or later' <<< "$out" || { echo "$s under bash $v: $out"; exit 1; }
            done
          done
          out="$(docker run --rm -v "$PWD":/src -w /src -e RENTSYNC_SETTINGS=/nonexistent bash:4.4 \
            bash infra/bootstrap/bootstrap-iam.sh 2>&1)" || true
          grep -q 'bootstrap-init.sh first' <<< "$out" || { echo "bash 4.4 was refused: $out"; exit 1; }
      # The same runner developers use on Windows and macOS, so it can't silently break.
      - name: Host and bootstrap script tests (stub aws, gh and docker; in the test container)
        run: bash infra/test/run.sh
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.3"
      - name: Bootstrap-HCP and HCP secret audit tests (fake API)
        run: |
          ruby infra/bootstrap/test/bootstrap_hcp_test.rb
          ruby infra/bootstrap/test/audit_hcp_secrets_test.rb
      # Each PR writes its build-log entry into its own slot (docs/ai-build-log.md).
      - name: Build log slots
        run: |
          ruby bin/test/build_log_test.rb
          ruby bin/build-log check

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    # Service containers are reached on localhost inside an Actions job,
    # so these override the Compose hostnames in .env.example.
    env:
      RACK_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mock_pms_ci_gh
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mock_pms_ci_gh_test
      DEPLOYMENT_ID: ci-gh
      REDIS_URL: redis://localhost:6379/0
      ADMIN_TOKEN: ci-admin-token
    defaults:
      run:
        working-directory: mock_pms
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mock_pms
      - run: bundle exec bin/setup --test-db-only
      - run: bundle exec rubocop
      - run: bundle exec rspec

  # Constitution VI: an OTLP backend runs in CI and receives every service's telemetry.
  telemetry-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start the stack
        run: docker compose up -d --build --wait postgres redis mock_pms mock_pms_worker otel-collector openobserve
      - run: docker compose exec -T mock_pms bundle exec bin/setup
      - name: Generate a scenario
        run: |
          set -a; . ./.env; set +a
          curl -fsS -X POST localhost:4001/admin/scenarios/tenant_move_out \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" -d '{}'
      - name: Telemetry reaches OpenObserve
        run: docker compose exec -T mock_pms bundle exec bin/telemetry_smoke
      - name: Logs on failure
        if: failure()
        run: docker compose logs

  # Feature 002: Terraform and host scripts (research R15). No cloud access needed.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate and test each root and the host module
        run: |
          for root in infra/terraform/shared infra/terraform/environment infra/terraform/modules/host; do
            terraform -chdir=$root init -backend=false -input=false
            terraform -chdir=$root validate
            terraform -chdir=$root test
          done
      - name: Static checks
        run: bash infra/terraform/check_prevent_destroy.sh
      - name: Shellcheck
        run: |
          find infra/host/bin infra/host/test infra/terraform infra/bootstrap infra/bootstrap/test -maxdepth 1 -type f \( -path "infra/host/bin/*" -o -name "*.sh" \) -print0 | xargs -0 shellcheck
      - name: Boot volume test (loop device)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xfsprogs
          sudo bash infra/host/test/boot_volume_test.sh
      - name: Render-env test (stub aws)
        run: bash infra/host/test/render_env_test.sh
      - name: Deploy-script test (stub docker and aws)
        run: bash infra/host/test/deploy_test.sh
      - name: Bootstrap-init test (stub gh)
        run: bash infra/bootstrap/test/bootstrap_init_test.sh
      - name: Bootstrap-IAM test (stub aws)
        run: bash infra/bootstrap/test/bootstrap_iam_test.sh
      - name: Bootstrap-GitHub test (stub gh)
        run: bash infra/bootstrap/test/bootstrap_github_test.sh
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Bootstrap-HCP test (fake API)
        run: ruby infra/bootstrap/test/bootstrap_hcp_test.rb

# Builds the mock PMS image for one commit and pushes it to ECR (feature 002 research R9).
# Reusable: called by release.yml and deploy.yml. Tags are immutable, so an existing tag is
# skipped and a re-run never produces a second image for one commit.
#
# Only the build role (rentsync-github-build, trusted solely for refs/heads/main) can push, so an
# existing tag was pushed by a main build. The job outputs the image digest, and deploys pin it
# (<sha>@sha256:<digest>), so hosts run exactly this image (security review 2026-10-21).
name: Build image

on:
  workflow_call:
    inputs:
      sha:
        description: Full 40-character commit SHA to build; also the image tag
        required: true
        type: string
    outputs:
      digest:
        description: sha256 digest of the image for this commit
        value: ${{ jobs.build.outputs.digest }}

permissions:
  id-token: write # GitHub OIDC to AWS; no stored keys
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm # native arm64 for the Graviton hosts (research R4)
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    env:
      SHA: ${{ inputs.sha }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
    steps:
      - name: Check the SHA
        run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-character commit SHA"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Skip if this commit is already built
        id: exists
        run: |
          if aws ecr describe-images --repository-name "${ECR_REPOSITORY_URL#*/}" \
               --image-ids "imageTag=$SHA" > /dev/null 2>&1; then
            echo "image $SHA already in ECR; skipping the build"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.exists.outputs.found != 'true'
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: push
        if: steps.exists.outputs.found != 'true'
        with:
          context: mock_pms
          platforms: linux/arm64
          build-args: GIT_SHA=${{ inputs.sha }}
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ inputs.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record the digest
        id: digest
        run: |
          digest="$(aws ecr describe-images --repository-name "${ECR_REPOSITORY_URL#*/}" \
            --image-ids "imageTag=$SHA" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest for $SHA: $digest"; exit 1; }
          echo "image $SHA is $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

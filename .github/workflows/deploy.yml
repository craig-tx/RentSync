# Manual deploy and rollback (feature 002 FR-029, runbook §Rollback). This is the one documented
# action for either. A prod-us run waits for the prod-us Environment's required reviewer.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Deployment to change
        required: true
        type: choice
        options: [dev-staging, prod-us]
      image_tag:
        description: Full commit SHA to deploy (built first if missing). Leave empty with rollback.
        required: false
        type: string
        default: ""
      rollback:
        description: Roll back to the previously deployed image
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    if: ${{ !inputs.rollback }}
    uses: ./.github/workflows/build-image.yml
    with:
      sha: ${{ inputs.image_tag }}

  deploy:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    uses: ./.github/workflows/deploy-to.yml
    with:
      deployment_id: ${{ inputs.deployment_id }}
      image_tag: ${{ inputs.image_tag }}
      rollback: ${{ inputs.rollback }}

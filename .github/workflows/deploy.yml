# Manual deploy, rollback and reload (feature 002 FR-029; runbook §Rollback, §Secret rotation).
# This is the one documented action for each. A prod-us run waits for the prod-us Environment's
# required reviewer.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Deployment to change
        required: true
        type: choice
        options: [dev-staging, prod-us]
      image_tag:
        description: Full commit SHA to deploy (built first if missing). Leave empty for rollback or reload.
        required: false
        type: string
        default: ""
      rollback:
        description: Roll back to the previously deployed image
        required: false
        type: boolean
        default: false
      reload:
        description: Re-render secrets from SSM and restart the current image (after a secret rotation)
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    if: ${{ !inputs.rollback && !inputs.reload }}
    uses: ./.github/workflows/build-image.yml
    with:
      sha: ${{ inputs.image_tag }}

  # RentSync's API image (feature 003 research R15), once its repository is configured.
  build-api:
    if: ${{ !inputs.rollback && !inputs.reload && vars.API_ECR_REPOSITORY_URL != '' }}
    uses: ./.github/workflows/build-image.yml
    with:
      sha: ${{ inputs.image_tag }}
      context: api
      repository_url: ${{ vars.API_ECR_REPOSITORY_URL }}

  deploy:
    needs: [build, build-api]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') }}
    uses: ./.github/workflows/deploy-to.yml
    with:
      deployment_id: ${{ inputs.deployment_id }}
      image_tag: ${{ inputs.image_tag }}
      image_digest: ${{ needs.build.outputs.digest }}
      api_image_digest: ${{ needs.build-api.outputs.digest }}
      rollback: ${{ inputs.rollback }}
      reload: ${{ inputs.reload }}

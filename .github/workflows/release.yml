# Release (feature 002 research R9, US4): every green main build is released to dev-staging,
# then promoted to prod-us after the prod-us Environment's required reviewer approves.
# Both deployments get the same images; nothing is rebuilt between them (FR-027).
#
# A release is the mock PMS image and RentSync's API image at one commit SHA (feature 003
# research R15). The API image is built only once the bootstrap has set API_ECR_REPOSITORY_URL
# (runbook §Releasing RentSync's API); until then a release ships the mock alone, as before.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

# No workflow-level concurrency group: one would hold every later merge while a prod-us approval
# is pending, and GitHub keeps only one pending run per group. Serialization is per deployment,
# in deploy-to.yml: dev-staging keeps receiving merges, and a newer pending prod-us promotion
# replaces an older unapproved one, so you always approve the latest.

jobs:
  build:
    # Skipped until the bootstrap has set ECR_REPOSITORY_URL (runbook §Bootstrap).
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.ECR_REPOSITORY_URL != '' }}
    uses: ./.github/workflows/build-image.yml
    with:
      sha: ${{ github.event.workflow_run.head_sha }}

  build-api:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.ECR_REPOSITORY_URL != '' && vars.API_ECR_REPOSITORY_URL != '' }}
    uses: ./.github/workflows/build-image.yml
    with:
      sha: ${{ github.event.workflow_run.head_sha }}
      context: api
      repository_url: ${{ vars.API_ECR_REPOSITORY_URL }}

  # Runs when the mock built and the API either built or was skipped (not yet configured); a
  # failed API build stops the release.
  deploy-dev-staging:
    needs: [build, build-api]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') }}
    uses: ./.github/workflows/deploy-to.yml
    with:
      deployment_id: dev-staging
      image_tag: ${{ github.event.workflow_run.head_sha }}
      image_digest: ${{ needs.build.outputs.digest }}
      api_image_digest: ${{ needs.build-api.outputs.digest }}

  # Waits here for approval (prod-us Environment reviewer). Its URLs come from SITE_URL and
  # APP_URL. The same digests as staging: production runs the exact images staging verified.
  deploy-prod-us:
    needs: [build, build-api, deploy-dev-staging]
    if: ${{ !cancelled() && needs.deploy-dev-staging.result == 'success' }}
    uses: ./.github/workflows/deploy-to.yml
    with:
      deployment_id: prod-us
      image_tag: ${{ github.event.workflow_run.head_sha }}
      image_digest: ${{ needs.build.outputs.digest }}
      api_image_digest: ${{ needs.build-api.outputs.digest }}
